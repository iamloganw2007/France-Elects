<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Elections · simulateur</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--onfleur:#fff;--bg:#eef1f6;--panel:#fff;--ice:#dde3ec;--line:#c8d0dc;--ink:#121a2c;--mute:#5a6578;--fleur:#1f3f8f;--ok:#1f7a4d;--bad:#b3261e;--warn:#a86200;--bleu:#002395;--rouge:#ed2939;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--onfleur:#0e1421;--bg:#0e1421;--panel:#161f2f;--ice:#232f42;--line:#2f3d54;--ink:#e7ecf4;--mute:#97a3b8;--fleur:#7ea2f0;--ok:#4cc38a;--bad:#ff7b72;--warn:#f0a845}}
:root[data-theme="dark"]{--onfleur:#0e1421;--bg:#0e1421;--panel:#161f2f;--ice:#232f42;--line:#2f3d54;--ink:#e7ecf4;--mute:#97a3b8;--fleur:#7ea2f0;--ok:#4cc38a;--bad:#ff7b72;--warn:#f0a845}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.42 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.01em}
h2{font-size:18px;font-weight:800}h3{font-size:13.5px;font-weight:600;margin-bottom:8px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fleur);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
header:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--bleu) 0 33.3%,#fff 33.3% 66.6%,var(--rouge) 66.6%)}
.brand{font:800 15.5px "Bricolage Grotesque",sans-serif;color:var(--fleur);margin-right:auto}
.stat{display:flex;flex-direction:column;font-size:11px;color:var(--mute)}.stat b{font-size:14.5px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px}.seg button[aria-pressed=true],.seg button.on{background:var(--fleur);color:var(--onfleur)}
nav{display:flex;gap:4px;padding:8px 20px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:10px 16px;border-bottom:3px solid transparent;font-weight:600;color:var(--mute);white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--fleur)}
nav button .bub{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--rouge);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding:12px 20px;max-width:1800px;margin:auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11.5px}.bar .n{width:46px;font-weight:600}
.bar .t{flex:1;height:14px;background:var(--ice);border-radius:3px;overflow:hidden;position:relative}.bar .t i{display:block;height:100%}
.bar .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.bar .v{width:52px;text-align:right}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.layers button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:11.5px}.layers button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
svg text{font-family:inherit}
.circ{cursor:pointer;stroke:#fff;stroke-width:.7;vector-effect:non-scaling-stroke}
.circ:hover{stroke:var(--ink);stroke-width:1.6}.circ.sel{stroke:var(--ink);stroke-width:2.6}
.mapwrap{position:relative}.mapwrap svg.main{width:100%;height:auto;display:block;touch-action:none;cursor:grab;user-select:none}
.mapwrap svg.main:active{cursor:grabbing}
.mapzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapzoom button{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:700}
.boxlab{font-size:135px;fill:var(--mute);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.act{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.act:disabled{opacity:.45;cursor:not-allowed}.act:hover:not(:disabled){border-color:var(--fleur)}.act b{font-size:12.5px}.act small{color:var(--mute)}
.act.vbtn{background:var(--fleur);color:var(--onfleur);border-color:var(--fleur)}.act.vbtn small{color:inherit;opacity:.85}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.acard{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 10px}
.acard:hover:not(:disabled){border-color:var(--fleur)}.acard:disabled{opacity:.45;cursor:not-allowed}
.acard .aem{font-size:18px;grid-row:span 2}.acard b{font-size:12.5px}.acard .adesc{font-size:11px;color:var(--mute);display:block}
.acard .acost{grid-column:2;display:flex;gap:10px;font-size:11px;color:var(--mute)}
.asec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.asec:first-of-type{border:0;margin-top:0;padding-top:0}
.ahead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.tick{font-size:11.5px;border-left:4px solid var(--fleur);padding:6px 10px;background:var(--ice);border-radius:0 6px 6px 0;margin:6px 0}
.tick.bad{border-color:var(--bad)}.tick.ok{border-color:var(--ok)}
.big{font:800 34px "Bricolage Grotesque",sans-serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:11.5px}.chip.on{background:var(--fleur);color:var(--onfleur);border-color:var(--fleur)}
.pchip{display:inline-flex;align-items:center;gap:6px;font-weight:600}.pchip i{display:inline-block;width:10px;height:10px;border-radius:50%}
.news{border-bottom:1px solid var(--line);padding:8px 0;font-size:12.5px}.news:last-child{border:0}
.news button{margin:6px 6px 0 0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:11.5px}.news button:hover{border-color:var(--fleur)}
.note{font-size:11px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--fleur);border-radius:8px;padding:8px 10px}.kpi small{color:var(--mute);display:block;font-size:11px}.kpi b{font:800 20.5px "Bricolage Grotesque",sans-serif}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}table.t th,table.t td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}table.t th{color:var(--mute);font-weight:600;font-size:11px}table.t td.r,table.t th.r{text-align:right}
table.t tr[data-r]{cursor:pointer}table.t tr[data-r]:hover td{background:var(--ice)}
.bgrow{display:grid;grid-template-columns:1fr auto 60px;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11.5px;cursor:pointer}.bgrow:hover,.bgrow.sel{background:var(--ice)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;border:1px solid currentColor}
.scroll{max-height:420px;overflow:auto}
select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.prog{display:flex;gap:3px;margin:6px 0}.prog i{flex:1;height:7px;border-radius:3px;background:var(--ice)}.prog i.d{background:var(--fleur)}.prog i.r1{background:var(--rouge)}
/* broadcast */
.bc{--ice:#1b2a3e;--panel:#0a1322;--ink:#fff;--mute:#9db0c6;--line:#2a3d57;background:#0a1322;color:#fff;border-radius:12px;overflow:hidden;border:1px solid #1e2d44;margin-bottom:16px}
.bc-top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;background:#0f1d33;border-bottom:3px solid var(--rouge);border-left:8px solid var(--bleu)}
.bc-top b{font:800 17px "Bricolage Grotesque",sans-serif;margin-right:auto}
.bc-live{background:var(--rouge);padding:2px 10px;border-radius:3px;font-weight:700;letter-spacing:.08em;font-size:11px}
.bc-clock{font:800 22px "Bricolage Grotesque",sans-serif}
.bc-btn{border:1px solid #2a3d57;background:#12213a;color:#fff;border-radius:6px;padding:7px 14px;font-weight:600}.bc-btn.go{background:var(--rouge);border-color:var(--rouge)}
.bc-banner{padding:9px 16px;font:800 15.5px "Bricolage Grotesque",sans-serif;background:#12213a;border-bottom:1px solid var(--line);min-height:44px}
.bc-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}@media(max-width:900px){.bc-grid{grid-template-columns:1fr}}
.bc-main{padding:12px 16px;border-right:1px solid var(--line)}.bc-side{padding:12px 16px}
.bc-score{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:8px}
.bc-tile{background:#12213a;border-top:5px solid;padding:8px 10px;border-radius:0 0 6px 6px}.bc-tile b{display:block;font-size:11.5px;letter-spacing:.04em}.bc-tile .n{font:800 30px "Bricolage Grotesque",sans-serif;line-height:1.1}.bc-tile small{color:var(--mute);display:block;font-size:11px}
.bc h4{margin:14px 0 6px;font:700 12px "IBM Plex Sans",sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.bc-row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #16263d;font-size:11.5px}.bc-row i{width:10px;height:10px;border-radius:2px;flex:none}
.bc-tick{display:flex;align-items:center;background:#0f1d33;border-top:2px solid var(--rouge);overflow:hidden}
.bc-tl{background:var(--rouge);padding:8px 14px;font-weight:700;font-size:11px;letter-spacing:.08em;white-space:nowrap;z-index:1}
.bc-tw{overflow:hidden;flex:1}.bc-tw span{display:inline-block;white-space:nowrap;padding-left:100%;animation:bcm 70s linear infinite;font-size:12.5px}
@keyframes bcm{to{transform:translateX(-100%)}}
.bc .circ{stroke:#fff}
/* modal */
.backdrop{position:fixed;inset:0;z-index:900;background:rgba(5,10,20,.62);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border-radius:12px;border:1px solid var(--line);padding:0}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.modal .mh h2{margin-right:auto}
.modal .mb{padding:16px 18px}
.xbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px}
/* start screen */
#startscreen{position:fixed;inset:0;z-index:1000;overflow:auto;background:var(--bg)}
.st-hero{padding:46px clamp(18px,5vw,70px) 30px;background:linear-gradient(115deg,#0c1d4f 0%,#14307a 38%,#1b3c91 52%,#8a1c2b 100%);color:#fff;position:relative}
.st-hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--bleu) 0 33.3%,#fff 33.3% 66.6%,var(--rouge) 66.6%)}
.st-hero h1{font:800 clamp(34px,6vw,64px)/.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.st-hero p{max-width:640px;font-size:15.5px;opacity:.9}
.st-tools{position:absolute;top:14px;right:16px;display:flex;gap:8px}.st-tools .seg{border-color:#ffffff55}.st-tools button{color:#fff}
.st-body{padding:24px clamp(18px,5vw,70px) 60px;max-width:1300px}
.st-body h2{margin:22px 0 10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.party-choice{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;border-top:6px solid var(--party);min-height:118px;display:flex;flex-direction:column;gap:3px}
.party-choice.selected{border-color:var(--party);box-shadow:0 0 0 3px color-mix(in srgb,var(--party) 35%,transparent)}
.party-choice b{font:800 17px "Bricolage Grotesque",sans-serif}.party-choice small{color:var(--mute);font-size:11px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mode-choice{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;text-align:left}
.mode-choice.selected{border-color:var(--fleur);box-shadow:0 0 0 3px color-mix(in srgb,var(--fleur) 30%,transparent)}
.mode-choice b{font:800 15.5px "Bricolage Grotesque",sans-serif;display:block}.mode-choice small{color:var(--mute)}
.mode-choice[disabled]{opacity:.5}
.gobtn{margin-top:22px;padding:14px 26px;border:0;border-radius:10px;background:var(--rouge);color:#fff;font:800 15.5px "Bricolage Grotesque",sans-serif}.gobtn:disabled{opacity:.4;cursor:not-allowed}
/* hemicycle */
.hemi svg{width:100%;height:auto;display:block}
.pie-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px;font-size:11.5px;margin-top:8px}
.pie-legend span{display:flex;gap:6px;align-items:center}.pie-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.duel{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--ice)}.duel i{display:block;height:100%}
.late{color:var(--rouge)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Campaign page: same three-column layout as the Canadian game ===== */
.grid.mapgrid{grid-template-columns:minmax(0,1fr) 316px 320px;grid-template-rows:auto 1fr;grid-template-areas:"map act top" "map bot bot";align-items:start;gap:12px 16px}
.mapgrid>.mapcol{grid-area:map;min-width:0}
.mapgrid>.actcol{grid-area:act;align-self:stretch;display:flex;flex-direction:column;gap:12px;min-width:0}
.mapgrid>.sidetop{grid-area:top;min-width:0}
.mapgrid>.sidebot{grid-area:bot;display:grid;grid-template-columns:1fr;gap:16px;align-items:start;min-width:0}
.actcol>.card{padding:12px;margin-bottom:0}.actcol h3{margin-bottom:4px}
.sidetop>:last-child,.sidebot>.card{margin-bottom:0}
@media(min-width:1321px){.mapgrid>.sidetop{align-self:stretch;display:flex;flex-direction:column}.sidetop>:last-child{flex:1 1 auto}}
@media(max-width:1320px){.grid.mapgrid{grid-template-columns:minmax(0,1fr) 316px;grid-template-rows:auto;grid-template-areas:"map act" "top top" "bot bot"}.mapgrid>.actcol{align-self:start}.mapgrid>.sidetop{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}.mapgrid>.sidetop>.card{margin:0}}
@media(max-width:900px){.grid.mapgrid{grid-template-columns:1fr;grid-template-areas:"map" "act" "top" "bot"}}
.actcol .asec{margin-top:10px;border:0;padding-top:0}.actcol .asec:first-of-type{margin-top:2px}
.actcol .ahead{font-size:12.5px;margin-bottom:6px;gap:0 8px}.actcol .ahead .note{font-size:11px}
.actcol .actgrid{grid-template-columns:1fr 1fr;gap:5px}
.actcol .acard{grid-template-columns:auto 1fr;grid-template-areas:"e t" "c c";gap:2px 7px;padding:5px 8px;border-radius:10px;align-content:start}
.actcol .aem{grid-area:e;font-size:18px;grid-row:auto;line-height:1;align-self:center}.actcol .atx{grid-area:t;font-size:11.5px;line-height:1.2}
.actcol .adesc{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.actcol .acost{grid-area:c;grid-column:auto;margin-top:0;gap:4px;font-size:11px;font-weight:600;flex-wrap:wrap;color:var(--ink)}
.actcol .acost span{background:var(--ice);border-radius:999px;padding:0 7px}
.actcol .tick .chip{margin:2px 0}
.mapgrid .bgrow{grid-template-columns:1fr auto 70px 52px;gap:10px;padding:7px 8px;border-radius:8px;border:0;font-size:12.5px}
.bgbar{height:6px;border-radius:3px;background:var(--ice);overflow:hidden}.bgbar i{display:block;height:100%}
.bgv{text-align:right;font-weight:700}.bgrow.sel .bgn{font-weight:600}
#turn .news{font-size:12.5px}#turn .news button{margin:6px 6px 0 0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:11.5px}
.poll-chart-wrap{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.sidetop details summary,.actcol details summary{cursor:pointer;font-size:11.5px}
.actcol .acard{text-align:left}.actcol .acard .aem{grid-row:auto}.actcol .acard .acost{grid-column:1/-1}
.actcol .acard b{font-size:11.5px}
.sidebot .hemi{max-width:440px;margin:0 auto}
.cmpcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}
.cmprow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:11.5px}.cmprow .n{width:40px;font-weight:700}
.cmprow .t{flex:1;height:14px;background:var(--ice);border-radius:3px;position:relative;overflow:hidden}.cmprow .t i{position:absolute;left:0;top:0;bottom:0;display:block}
.cmprow .t i.pale{opacity:.35}.cmprow .t i:not(.pale){top:3px;bottom:3px}.cmprow .v{width:52px;text-align:right;font-weight:700}
.bc .hemi{max-width:420px;margin:0 auto}
.bc .cmprow .t i.pale{opacity:.5;filter:brightness(1.7) saturate(.8)}
/* ===== governing ===== */
.ghead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ghead h2{margin:0 0 6px}.ghead p{margin:4px 0}
.gh-r{display:flex;gap:8px;flex-wrap:wrap}.gh-r .act{min-width:190px}
.gslim.card{padding:12px 18px}.gslim .kpis{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}.gslim .kpi{padding:4px 8px}.gslim .kpi b{font-size:13.5px}.gslim .kpi small{font-size:11px}
.gtabs{position:sticky;top:0;z-index:30;display:flex;gap:4px;padding:6px;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow-x:auto}
.gtab{flex:1 0 auto;min-width:118px;border:0;background:none;border-radius:8px;padding:9px 10px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font:inherit}
.gtab .gt-l{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.gtab:hover{background:var(--ice)}.gtab.on{background:var(--fleur);color:var(--onfleur)}
.gt-b{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.gt-b.am{background:#e3a008;color:#1b1300}.gtab.on .gt-b{background:var(--onfleur);color:var(--fleur)}
.card.alert{border-left:4px solid var(--warn)}.card.offer{border-left:4px solid var(--fleur)}
.bill{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.bill .b-l{flex:1 1 300px;min-width:0}.bill .b-r{display:flex;gap:6px;flex-wrap:wrap}.bill .b-r .act{min-width:150px}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--ice);margin:6px 0 3px}.vbar i{display:block;height:100%}
.vc{margin-right:10px}.vc.for{color:var(--ok)}.vc.ag{color:var(--bad)}
.tag.pm,.tag.gov{color:var(--fleur);border-color:var(--fleur)}.tag.sup{color:var(--ok)}.tag.nc{color:var(--warn)}.tag.opp{color:var(--mute)}

.mpool{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.mpool-p{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.mpool-p .tk-lbl{min-width:58px}
.mchip{font:inherit;font-size:11px;padding:4px 8px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:grab}
.mchip small{color:var(--mute)}.mchip.on{outline:2px solid var(--fleur);background:var(--ice)}.mchip.used{opacity:.45}
.mslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.mslot{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:7px 9px;border:1.5px dashed var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.mslot small{font-size:11.5px;color:var(--mute);font-weight:600}.mslot.full{border-style:solid;border-width:1.5px 1.5px 1.5px 5px}.mslot .ms-n{font-weight:700;font-size:12px}.mslot:disabled{cursor:default;opacity:1}
.fsat{display:inline-block;width:90px;height:7px;border-radius:4px;background:var(--ice);overflow:hidden}.fsat i{display:block;height:100%}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;box-shadow:0 0 0 1.5px var(--panel)}
.rsp{padding:8px 10px;border-radius:8px;border:1px solid var(--line);border-left-width:4px;margin:0 0 6px}.rsp.yes{border-left-color:var(--ok)}.rsp.no{border-left-color:var(--bad)}
.rsp-h{display:flex;align-items:center;gap:8px}.rsp-h b{margin-left:auto}.rsp.yes .rsp-h b{color:var(--ok)}.rsp.no .rsp-h b{color:var(--bad)}
.rsp-fb{margin-top:4px;font-size:11.5px;font-weight:700}.rsp-fb.sup{color:var(--warn)}.rsp-fb.opp{color:var(--bad)}.rsp.fbs{border-left-color:var(--warn)}
.gpoll:not(.big) .poll-chart-wrap svg{max-height:300px}

.insn{display:inline-block;min-width:17px;text-align:center;border:1px solid currentColor;border-radius:50%;font-size:10px;line-height:15px;margin-right:2px}

/* ===== compact UI (Logan 2026-10-20: the interface was too big) ===== */
header{padding:6px 16px}
nav{padding:4px 16px 0}nav button{padding:7px 12px}
main{padding:10px 14px}
.grid{grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.card{padding:12px 14px;margin-bottom:12px;border-radius:8px}
h3{margin-bottom:6px}
.bar{margin:3px 0}.bar .t{height:11px}
.gtabs{padding:4px;margin:0 0 12px}.gtab{padding:6px 8px;min-width:100px}
.chip{padding:3px 10px}
button.vbtn:not(.act){padding:5px 12px}
.kribbon{gap:10px 0}
.mapwrap svg.main{max-height:70vh;width:auto;max-width:100%;margin:0 auto}
.votecard .hemi{max-width:420px}
.sidebot .hemi{max-width:340px}
.bc .hemi{max-width:360px}
.poll-chart-wrap{margin-top:10px;padding-top:8px}
.gpoll:not(.big) .poll-chart-wrap svg{max-height:240px}
.gpoll.big .poll-chart-wrap svg{max-height:340px}
.layers{gap:4px;margin-bottom:6px}.layers button{padding:3px 9px}
.kgrp{gap:5px;padding:0 14px}.kcells{gap:0 16px}
/* crises and projects */
.cr-tag{display:inline-block;font:600 11px/1.35 system-ui,-apple-system,sans-serif;color:#b42318;background:#fdecea;border:1px solid #f4c7c2;border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;white-space:normal;max-width:100%;vertical-align:middle}
.cr-tag.bad{color:#7a1f12;background:#fbe3dc}
.cr-card{border-left:4px solid var(--line)}
.cr-h{display:flex;gap:10px;align-items:center}.cr-em{font-size:24px}
.cr-stage{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cr-dots{display:inline-flex;gap:3px}.cr-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.cr-ctl{display:flex;gap:8px;align-items:center;font-size:12px;margin:6px 0}.cr-ctl .t{flex:1;height:8px;border-radius:4px;background:var(--ice);overflow:hidden}.cr-ctl .t i{display:block;height:100%;background:var(--ok)}
.cr-eco{font-size:12px;margin:6px 0}
.cr-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.cr-opt{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:4px}.cr-opt.done{border-color:var(--ok)}
.cr-opt .chip{align-self:flex-start;margin-top:4px}.cr-ok{color:var(--ok);font-weight:700;font-size:12px}
.crpop-i{border-left:5px solid var(--line);background:var(--ice);border-radius:10px;padding:10px 12px;margin:10px 0}
.crpop-k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.crpop-t{font-size:17px;font-weight:700;margin:4px 0}
.mo-odds{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--ice)}.mo-odds i{display:block;height:100%}
.pjf{display:grid;grid-template-columns:1fr 64px 26px;gap:6px;align-items:center;font-size:11.5px;margin:2px 0}.pjf b{text-align:right}
.tick{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:12px}
.pjsite{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0;font-size:12px}
.pjctr{display:grid;gap:6px}.pjctr .act{min-height:0}
.pjdec{border:2px solid #d97706;border-left-width:6px;border-radius:10px;background:color-mix(in srgb,#f59e0b 12%,var(--panel));padding:10px 12px;margin:0 0 12px}
.pjdec h3{margin:0 0 8px;color:#b45309;display:flex;align-items:center;gap:8px}
[data-theme="dark"] .pjdec h3{color:#fbbf24}
.pjdec-n{background:#d97706;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.pjdec-i{background:var(--panel);border:1px solid color-mix(in srgb,#d97706 40%,var(--line));border-radius:8px;padding:8px 10px;margin:6px 0}
.pjdec-o{display:flex;flex-wrap:wrap;gap:6px}.pjdec-o button{margin:0;padding:5px 12px;border-radius:8px;border:1px solid #d97706;background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer}
.pjdec-o button:hover:not(:disabled){background:#d97706;color:#fff}.pjdec-o button:disabled{opacity:.45;cursor:not-allowed}
.pjmenu{display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto;padding-right:4px}
.pjmc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.pjmc.off{opacity:.55;filter:grayscale(1)}.pjmc.off.on{opacity:1;filter:none}
.pjmh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pjnm{all:unset;cursor:pointer;font-weight:700;font-size:13px}.pjnm:hover{color:var(--fleur)}
.pjmb{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}.pjmb button{margin:0;padding:3px 10px;font-size:11.5px}
.pjmb .vb{background:var(--fleur);color:var(--onfleur);border-color:var(--fleur);font-weight:600}
.pjmb button:disabled{opacity:.45;cursor:not-allowed}
.pjacts{display:grid;gap:0}.pjact{padding:8px 0;border-bottom:1px solid var(--line)}.pjact:last-child{border-bottom:0}
.pjctl{display:grid;gap:4px;margin-top:6px}.pjctl select{padding:4px 6px;font-size:12px;width:100%}.pjctl input{width:100%}.pjctl .chip{justify-self:start}

/* ===== governing screen = Canadian layout (Logan 2026-10-20) ===== */
main:has(.gtop){max-width:1280px}
.gtop{padding:12px 16px}
.gtop-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
.gtop-row>b{font-size:15px}
.qbar{display:flex;gap:3px;margin:0 0 8px}
.qbar i{flex:1;height:7px;border-radius:3px;background:var(--ice)}
.qbar i.d{background:var(--fleur)}.qbar i.c{background:var(--fleur);opacity:.45}
.qbar i.p{box-shadow:inset 0 0 0 2px var(--warn)}.qbar i.y{margin-right:8px}
.gsteps{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;font-size:12.5px;color:var(--mute);flex:1;min-width:0}
.gsteps span{padding:2px 0}
.gend{padding:7px 16px!important;border-radius:8px;font-weight:700}
.gtab{flex-direction:column;gap:2px;padding:7px 10px}
.gtab .gt-l{font-size:14px}
.gtab small{font-size:11.5px;color:var(--mute);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.gtab.on small{color:var(--onfleur);opacity:.85}
.gframe>div{min-width:0}
.gframe .votecard .hemi,.gframe .hemi{max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ===== platform builder (Canadian builder, adapted 2026-10-20) ===== */
#pfb{max-width:1360px;margin:0 auto}
#pfb h2{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf-dot{display:inline-block;width:11px;height:11px;border-radius:50%}
#pfb .pgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){#pfb .pgrid{grid-template-columns:1fr}}
#pfb .pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
#pfb .pf-sl{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:10px;align-content:start}
@media(max-width:700px){#pfb .pf-sl{grid-template-columns:1fr}}
#pfb #pfmeta,#pfb .pb-leg{grid-column:1/-1}
#pfb .sl label{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600}
#pfb .sl output{font-weight:700}
#pfb .sl input[type=range]{width:100%;display:block;margin:3px 0;accent-color:var(--fleur)}
#pfb .sl .ends{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--mute)}
#pfb .sl .ends span:last-child{text-align:right}
.pb{position:relative;margin:1px 0 4px}
.pb-col{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:14px;font-weight:700;pointer-events:none}
.pb-col:before{content:"";width:2px;height:6px;background:var(--mute);opacity:.6;margin-bottom:1px}
.pb-col b{color:var(--pc)}.pb-col b.me{text-decoration:underline;text-underline-offset:2px}
.pb-leg{font-size:12px;color:var(--mute);margin:2px 0 4px}
#pfb .pbar{display:flex;align-items:center;gap:10px;font-size:13.5px}
#pfb .pbar .t,#pfb .pdiv .t{flex:1;height:8px;background:var(--ice);border-radius:5px;overflow:hidden;position:relative}
#pfb .pbar .t i{display:block;height:100%;background:var(--fleur)}
#pfb .pdiv{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:5px 0}
#pfb .pdiv>span:first-child{width:140px;flex:none}
#pfb .pdiv .t i{position:absolute;top:0;height:100%;border-radius:4px}
#pfb .pchip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px}
#pfb h3{margin:0 0 4px}#pfb h4{margin:12px 0 2px;font-size:13px}
.pf-proj{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 10px;border-radius:8px;background:var(--ice);font-size:13px}.pf-proj b{font-size:18px}
#pfb .pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#pfb .pbtn{padding:9px 18px;border-radius:8px;border:1px solid var(--fleur);background:var(--fleur);color:var(--onfleur);font-weight:700;font-size:14px;cursor:pointer}
#pfb .pbtn.alt{background:var(--panel);color:var(--fleur)}
.pf-sum{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}.pf-sum .tag{font-size:11px}
/* vote ticker: one fixed chip per group, filled as its votes land */
.vticker{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 8px;font-size:12px;line-height:1}
.vtk{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;background:rgba(127,127,127,.08);white-space:nowrap;overflow:hidden;min-height:22px}
.vtk.off{opacity:.45}.vtk.run{outline:1px dashed var(--line)}
.vtk>i{width:8px;height:8px;border-radius:2px;flex:none}
.vtk em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}.vtk em.rb{color:var(--warn,#c80);font-weight:600}
/* Assemblée nationale cover page on bills */
.anh{container-type:inline-size;width:100%;box-sizing:border-box;text-align:center;color:#111;font-family:"Times New Roman",Times,Georgia,serif;padding:4px 0 6px}
.anh-logo{width:78px;height:48px;display:block;margin:0 auto 10px}
.anh-no{font-size:min(34px,10cqw);line-height:1.1}
.anh-dash{width:44px;height:1.5px;background:#111;margin:8px auto 10px}
.anh-an{font-size:min(30px,8.2cqw);white-space:nowrap;letter-spacing:.01em;line-height:1.05}
.anh-sc{font-size:min(12.5px,3.8cqw);letter-spacing:.09em;margin-top:6px}
.anh-leg{font-size:11.5px}
.anh-rule{border-top:3px double #111;margin:10px 0 8px}
.anh-reg{font-size:min(13.5px,4cqw)}
.anh-kind{font-weight:700;font-size:min(28px,8cqw);margin:20px 0 10px;letter-spacing:.01em}
.anh-title{font-size:17px;font-weight:700;font-style:italic;line-height:1.3;max-width:560px;margin:0 auto}
/* laws in force */
.cx-row{padding:8px 0;border-top:1px solid var(--line)}.cx-row:first-of-type{border-top:0}
.cx-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px}.cx-h b{text-align:right}
.cx-sc{display:grid;gap:3px;margin:6px 0 2px}.cx-c{min-height:18px;border-radius:4px;background:var(--line);display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;padding:2px}
.cx-c.on{background:var(--fleur);box-shadow:0 0 0 2px var(--fleur)}.cx-c i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--panel)}
.cx-f{display:flex;justify-content:space-between;color:var(--mute);font-size:10.5px;gap:8px}.cx-f small:last-child{text-align:right}
.cx-m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);margin-top:3px;flex-wrap:wrap}.cx-b{padding:1px 8px}
.cx-hot{color:var(--warn);font-weight:600}.cx-l{font-size:11px;color:var(--mute);margin-top:2px}
.cx-strike{color:var(--bad);font-weight:600;margin:4px 0}
.cx-t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}.cx-t td,.cx-t th{padding:4px 6px;border-bottom:1px solid #d8d2c4;text-align:left;vertical-align:top}.cx-t th{font-weight:600;color:#7b8794}
.cx-doc{width:100%!important;padding:26px 28px 30px!important}.cx-doc .cx-dh{display:block!important;text-align:center;margin-bottom:10px}.cx-tri{display:flex;justify-content:space-between;margin-bottom:12px}.cx-tri i{display:block;width:30%;height:4px;background:#0a2a8f}.cx-tri i:last-child{background:#e1242c}
.cx-dt{font-size:19px;letter-spacing:.06em}.cx-ds{font-size:12px;color:#5b6573;margin-top:4px;border-bottom:3px double #333;padding-bottom:8px}
.cx-doc .cx-row{border-top:0;padding:6px 0}.cx-doc .cx-c{background:#ebe7de}.cx-doc .cx-c.on{background:#23408e;box-shadow:0 0 0 2px #23408e}.cx-doc .cx-c i{border-color:#fff}
.cx-doc .cx-f,.cx-doc .cx-m,.cx-doc .cx-l{color:#6b7280;font-family:Inter,system-ui,sans-serif}.cx-doc .cx-hot{color:#a35b00}.cx-doc .cx-strike{color:#b3261e}
.dtk{width:44px;text-align:right;font-size:10.5px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}.dtk.up{color:var(--ok)}.dtk.dn{color:var(--bad)}
.bsl-law{color:var(--warn);font-weight:600;font-size:10px}
#crpop{z-index:10050!important}
</style>

 <div class="card"><h3>${x('Majorités possibles','Possible majorities')}</h3>${coal.map(c=>{const n=sb(c[1]);return `<div class="bar"><span class="n" style="width:230px;font-weight:500">${c[0]}</span><span class="t"><i style="width:${n/577*100}%;background:${n>=MAJ?'var(--ok)':'var(--mute)'}"></i><u style="left:${MAJ/577*100}%"></u></span><span class="v">${n}</span></div>`}).join('')}<p class="note">${x('Le président de la République nomme maintenant le Premier ministre.','The President now appoints the Prime Minister.')}</p></div></div>
 <div><div class="card"><h3>${x('Votre bilan','Your result')}</h3><div class="kpis"><div class="kpi" style="border-top-color:${pc(me)}"><small>${x('Sièges','Seats')}</small><b>${s[me]}</b></div><div class="kpi"><small>${x('Projection de départ','Starting projection')}</small><b>${SIM.s0??'—'}</b></div><div class="kpi"><small>${x('Note','Grade')}</small><b>${grade}</b></div></div></div>
 <div class="card"><h3>${x('Voix au 1er tour','First-round vote')}</h3>${pie(P.map((p,k)=>[r1[k],pc(k),p.n]),170,.5)}<div class="pie-legend">${P.map((p,k)=>`<span><i style="background:${pc(k)}"></i>${p.n} ${pct(r1[k]/WT)}</span>`).join('')}</div></div>
 <div class="card"><h3>${x('Par bloc','By bloc')}</h3>${pie(blocs.map((b,j)=>[sb(b[1]),pc(b[1][0]),b[0]]),150,.5)}<div class="pie-legend">${blocs.map(b=>`<span><i style="background:${pc(b[1][0])}"></i>${b[0]} ${sb(b[1])}</span>`).join('')}</div></div>
 <div class="card"><button class="act vbtn" data-startgov style="width:100%;margin-bottom:8px"><b>${x('Continuer : former un gouvernement →','Continue: form a government →')}</b><small>${x('Le président nomme un Premier ministre','The President appoints a Prime Minister')}</small></button><button class="act" data-newgame style="width:100%"><b>${x('Nouvelle partie','New game')}</b></button></div></div></div>`}
/* ===== debate modal ===== */
function debateModal(){let el=document.getElementById('dbmodal');const need=SIM.dbt&&(!SIM.dbt.closed)&&ACTIVE();if(!need){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='dbmodal';el.className='backdrop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
 el.innerHTML=`<section class="modal bc" style="width:min(820px,100%)"><div class="bc-top"><span class="bc-live">● ${x('EN DIRECT','LIVE')}</span><b>${x('Débat des têtes de liste · TF1','Party leaders’ debate · TF1')}</b><span>${x('Score','Score')} ${SIM.dbt.score>0?'+':''}${SIM.dbt.score}</span></div><div class="mb">${debateHTML()}</div></section>`}

/* ===== the parties' answers to a coalition proposal ===== */
function respModal(){let el=document.getElementById('respmodal');const R=SIM.fresp;if(!R||!R.rows){if(el)el.remove();return}
 if(!el){el=document.createElement('div');el.id='respmodal';el.className='backdrop';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
 const why=o=>{if(o.cord)return x('Refuse de gouverner avec certains partenaires proposés.','Will not govern alongside some of the partners proposed.');if(o.r==='nc')return o.yes?x('Ne votera pas la censure.','Will not vote to censure.'):x('Se réserve le droit de censurer.','Keeps the right to censure.');
  const d=x(`${o.met} demande(s) sur ${o.tot} satisfaite(s)`,`${o.met} of ${o.tot} demands met`);if(o.yes)return d+'. '+(o.s>=.6?x('Satisfait de l’accord.','Happy with the deal.'):x('Accepte, sans enthousiasme.','Accepts, without enthusiasm.'));
  return d+'. '+(o.s<.4?x('Trop peu de nos demandes sont satisfaites.','Too few of our demands are met.'):o.a<.45?x('Trop éloigné de votre ligne politique.','Too far from your political line.'):x('Le compte n’y est pas, de peu.','Not quite enough on the table.'))};
 const rows=R.rows.slice().sort((a,b)=>(b.yes*2+(b.fb==='sup'))-(a.yes*2+(a.fb==='sup'))).map(o=>`<div class="rsp ${o.yes?'yes':o.fb==='sup'?'no fbs':'no'}"><div class="rsp-h">${chipP(o.k)} <span class="note">${rn(o.r)}</span><b>${o.yes?'✓ '+x('Accepte','Accepts'):'✗ '+x('Refuse','Declines')}</b></div><div class="note">${why(o)} <span>(${x('chances ','odds ')}${Math.round(o.p*100)} %)</span></div>${o.fb?`<div class="rsp-fb ${o.fb}">→ ${o.fb==='sup'?x('Soutiendra le gouvernement de l’extérieur (confiance et budget), sans y entrer.','Will back the government from outside on confidence and supply, without joining it.'):x('Passe dans l’opposition.','Goes into opposition.')}</div>`:''}</div>`).join('');
 el.innerHTML=`<section class="modal" style="width:min(560px,100%)"><div class="mh"><h2>${x('Réponses des partis','The parties’ answers')}</h2><button class="chip" data-frespx aria-label="${x('Fermer','Close')}">✕</button></div><div class="mb">${rows||`<p class="note">${x('Vous n’avez sollicité aucun parti.','You did not approach any party.')}</p>`}
 <p style="margin:12px 0 0;font-weight:700;color:${R.ok?'var(--ok)':'var(--bad)'}">${R.ok?x('Le gouvernement est nommé.','The government is appointed.'):x('Le président refuse cette équipe.','The President turns this team down.')}</p>${R.why?`<p class="note">${R.why}</p>`:''}<button class="act vbtn" data-frespx style="margin-top:12px"><b>${x('Continuer','Continue')}</b></button></div></section>`}

/* ===== Start screen, saving, input handling ===== */
const AUTOKEY='frsim_auto2'/* new key 2026-10-20: measure list changed, older saves would mis-index bills */;
const MODES=[['leg','Législatives anticipées','Snap legislative election','Le président dissout l’Assemblée. Trois semaines de campagne, deux tours, 577 circonscriptions.','The President dissolves the Assembly. Three weeks of campaigning, two rounds, 577 seats.',1],['pres','Présidentielle 2027','2027 presidential election','Quatre semaines de course à l’Élysée : ralliements, vote utile, débat de l’entre-deux-tours et duel final.','Four weeks of racing for the Élysée: rallies, tactical voting, the run-off debate and the final duel.',1]];
let ss={mode:'leg',party:null,theme:null,diff:'normal'};try{const d=localStorage.getItem('frsim_diff');if(['easy','normal','hard'].includes(d))ss.diff=d}catch(e){}
function drawStart(){const el=$('#startscreen');if(!el)return;let has=false;try{has=!!localStorage.getItem(AUTOKEY)}catch(e){}
 el.innerHTML=`<div class="st-hero"><div class="st-tools"><div class="seg"><button data-lang="fr" aria-pressed="${lang==='fr'}">FR</button><button data-lang="en" aria-pressed="${lang==='en'}">EN</button></div><button class="seg" data-theme style="padding:6px 12px;background:none" aria-label="Thème / Theme">◐</button></div>
 <p style="margin:0 0 8px;letter-spacing:.14em;font-weight:700;font-size:13px">${x('SIMULATEUR ÉLECTORAL','ELECTION SIMULATOR')}</p><h1>${x('ÉLECTIONS<br>EN FRANCE','FRENCH<br>ELECTIONS')}</h1><p>${x('Menez votre parti à travers une élection à deux tours : alliances, campagne, désistements et soirées électorales, dans les 577 circonscriptions.','Lead your party through a two-round election: alliances, campaigning, run-off withdrawals and election nights, across all 577 constituencies.')}</p>
 ${has?`<button class="gobtn" data-cont style="background:#fff;color:#14307a;margin-top:6px">${x('Continuer la partie sauvegardée','Continue saved game')}</button>`:''}</div>
 <div class="st-body"><h2>${x('Choisissez l’élection','Choose the election')}</h2><div class="mgrid">${MODES.map(m=>`<button class="mode-choice ${ss.mode===m[0]?'selected':''}" data-mode="${m[0]}" ${m[5]?'':'disabled'}><b>${x(m[1],m[2])}</b><small>${x(m[3],m[4])}</small></button>`).join('')}</div>
 <h2>${x('Choisissez votre parti','Choose your party')}</h2><div class="pgrid">${P.map((p,k)=>p.pl?`<button class="party-choice ${ss.party===k?'selected':''}" style="--party:${pc(k)}" data-sp="${k}"><b>${p.n}</b><small>${pfull(k)}</small><small>${x('Intentions : ','Polling: ')}${pct((ss.mode==='pres'?TGP:TG0)[k],0)} · ${x('sièges 2024 : ','2024 seats: ')}${SEATS24[k]}</small></button>`:'').join('')}</div>
 <h2>${x('Votre thème central','Your central issue')}</h2><div class="layers">${TH.map((t,j)=>`<button class="${ss.theme===j?'on':''}" data-sth="${j}">${x(t[0],t[1])}</button>`).join('')}</div>
 <h2>${x('Difficulté','Difficulty')}</h2><div class="layers">${[['easy','Facile','Easy'],['normal','Normal','Normal'],['hard','Difficile','Hard']].map(d=>`<button class="${ss.diff===d[0]?'on':''}" data-sdiff="${d[0]}">${x(d[1],d[2])}</button>`).join('')}</div>
 <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="gobtn" data-go ${ss.party==null||ss.theme==null?'disabled':''}>${ss.mode==='pres'?x('ENTRER EN CAMPAGNE →','ENTER THE RACE →'):x('NÉGOCIER LES ALLIANCES →','NEGOTIATE ALLIANCES →')}</button><input id="seedin" type="number" placeholder="${x('Graine (facultatif)','Seed (optional)')}" style="margin-top:22px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:11em"></div>
 <p class="note" style="margin-top:20px">${x('Données : résultats officiels des législatives 2024 (ministère de l’Intérieur) et contours des circonscriptions (découpage 2010). Intentions de départ : niveau approximatif des sondages de l’automne 2026.','Data: official 2024 legislative results (Ministry of the Interior) and constituency boundaries (2010 map). Starting support: roughly autumn 2026 polling.')}</p></div>`}
function showStart(){let el=$('#startscreen');if(!el){el=document.createElement('section');el.id='startscreen';document.body.appendChild(el)}drawStart()}
function hideStart(){const el=$('#startscreen');if(el)el.remove()}
/* ===== save / load ===== */
function save(){try{const o={SIM,st:{tab:st.tab,layer:st.layer,lp:st.lp},C:C.map(d=>({l:d.l,r1:d.r1?{sh:d.r1.sh,cl:d.r1.cl}:null,res:d.res,run:d.res2run||null,ax:d.ax||null}))};localStorage.setItem(AUTOKEY,JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(AUTOKEY));if(!o||!o.SIM||!o.SIM.phase)return false;for(const k in SIM)delete SIM[k];Object.assign(SIM,o.SIM);setMode(SIM.mode||'leg',SIM.start,SIM.tg);o.C.forEach((c,i)=>{const d=C[i];d.l=c.l;d.r1=c.r1;d.res=c.res;d.res2run=c.run;d.ax=c.ax||{}});st={...st,...o.st,sel:null,zoom:null};seed=(SIM.seed*31+(SIM.day||0)*977+(SIM.r2day||0))|0;
 if(SIM.phase==='n1'||SIM.phase==='n2'){st.tab='night'}if(SIM.phase==='r2c'||SIM.phase==='end'||SIM.phase==='n2')C.forEach(d=>{if(d.r1&&d.res2run)d.pj2=r2Of(d)});return true}catch(e){return false}}
function beginCampaign(){SIM.phase='r1';SIM.day=1;SIM.debDay=PRES()?20:11;SIM.s0=projSeats()[SIM.me];SIM.t0=natShares(true);SIM.hist=[{day:1,s:natShares()}];addPolls();st.tab='map';st.layer='proj';save();render()}
/* ===== input ===== */
document.addEventListener('click',ev=>{const t=ev.target.closest('button,[data-r],a[data-r],[data-detk],[data-city]');if(!t)return;const D=t.dataset;
 if(D.lang){lang=D.lang;try{localStorage.setItem('frsim_lang',lang)}catch(e){}if($('#startscreen'))drawStart();render();return}
 if(D.theme!==undefined&&t.hasAttribute('data-theme')){const r=document.documentElement,dark=isDark();r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('frsim_theme',r.dataset.theme)}catch(e){}if($('#startscreen'))drawStart();render();return}
 /* start screen */
 if(D.mode){ss.mode=D.mode;return drawStart()}if(D.sp){ss.party=+D.sp;return drawStart()}if(D.sth){ss.theme=+D.sth;return drawStart()}if(D.sdiff){ss.diff=D.sdiff;try{localStorage.setItem('frsim_diff',ss.diff)}catch(e){}return drawStart()}
 if(t.hasAttribute('data-go')){if(ss.party==null||ss.theme==null)return;const sd=$('#seedin')&&$('#seedin').value;hideStart();newGame({party:ss.party,theme:ss.theme,diff:ss.diff,mode:ss.mode,seed:sd});return}
 if(t.hasAttribute('data-cont')){if(load()){hideStart();render();if(SIM.night)runNight()}return}
 if(t.hasAttribute('data-newgame')){if(!confirmNew())return;try{localStorage.removeItem(AUTOKEY)}catch(e){}for(const k in SIM)delete SIM[k];$('#main').innerHTML='';showStart();return}
 if(!SIM.phase)return;
 if(D.t){st.tab=D.t;return render()}
 if(D.r!=null&&t.matches('[data-r]')){if(drag&&drag.moved)return;ev.preventDefault();if(st.pjPick&&st.tab==='gov'&&st.gtab==='pj'&&pjClick(+D.r)){save();const y=scrollY;render();scrollTo(0,y);return}st.sel=+D.r===st.sel&&t.closest('svg')?null:+D.r;if(st.tab==='night')return;return render()}
 if(D.layer){st.layer=D.layer;return render()}if(D.lp){st.lp=+D.lp;st.layer='share';return render()}
 if(D.city){if(drag&&drag.moved&&!t.matches('button'))return;const i=+D.city;if(i<0){st.zoom=null;st.city=null}else{st.zoom=cityVB(i);st.city=i}return render()}
 if(D.zoom){zoomBy(+D.zoom>0?1/1.4:1.4);return}
 /* pacts */
 if(D.pact){const k=+D.pact,r=pactAccept(k,D.pt,D.greed);SIM.tried=SIM.tried||{};if(r.ok){const ex=SIM.pacts.find(q=>q.m.includes(k)&&q.type==='union'&&D.pt==='union');SIM.pacts=SIM.pacts.filter(q=>q!==ex&&!(D.pt==='union'&&q.type!=='union'&&q.m.includes(k)));SIM.pacts.push(mkPact(r.m,D.pt,D.pt==='union'?r.share:null));SIM.tried[k]=x('Accord conclu','Deal done')}else SIM.tried[k]=x('Proposition refusée','Offer turned down');SIM.offers=SIM.offers.filter(o=>o.k!==k);save();return render()}
 if(t.hasAttribute('data-begin'))return beginCampaign();
 if(D.rally!=null)return doRally(+D.rally);if(D.endo!=null){SIM.endo[SIM.me]=D.endo==='none'||D.endo==='nrn'?D.endo:+D.endo;save();return render()}if(D.court!=null)return courtCand(+D.court);if(t.hasAttribute('data-presr2'))return startPresR2();
 /* campaign */
 if(D.act!=null){const i=+D.act;if(i===5){st.pick=st.pick==='ann'?null:'ann';st.annT=null;return render()}if(i===6){st.pick=st.pick==='prep'?null:'prep';return render()}if(i===8){st.pick=st.pick==='itv'?null:'itv';return render()}if(i===4){st.pick=st.pick==='dig'?null:'dig';return render()}return doAct(i)}
 if(D.annt!=null){st.annT=+D.annt<0?null:+D.annt;return render()}
 if(D.ann!=null)return doAct(5,{m:+D.ann});
 if(D.prep!=null)return doAct(6,{tg:+D.prep});
 if(D.itv!=null)return doAct(8,{tg:+D.itv});
 if(D.dig!=null)return doAct(4,{tg:+D.dig<0?null:+D.dig});
 if(t.hasAttribute('data-next'))return nextDay();
 if(D.ev!=null)return resolveEv(+D.ev,+D.o);
 if(t.hasAttribute('data-dbopen')){startDebate();return render()}
 if(D.dbm!=null)return dbChoose(+D.dbm);if(t.hasAttribute('data-dbnext'))return dbNext();if(t.hasAttribute('data-dbclose')){SIM.dbt.closed=1;save();return render()}
 /* governing */
 if(govClick(t,D))return;
 /* nights */
 if(D.speed){st.speed=+D.speed;return drawNight()}if(t.hasAttribute('data-skip'))return runNight(true);if(t.hasAttribute('data-nightdone'))return finishNight();
 /* withdrawals */
 if(D.wd!=null){SIM.wdMe[+D.wd]=D.v==='1';save();return render()}if(D.wdp)return wdPreset(D.wdp);if(D.cons){SIM.cons[SIM.me]=D.cons;save();return render()}if(t.hasAttribute('data-wddone'))return finishWithdrawals();
});
function confirmNew(){return true}
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-r]:not(button)')){ev.preventDefault();ev.target.click()}});
(function init(){try{const t=localStorage.getItem('frsim_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}showStart()})();

/* cabinet board: drag a minister onto a ministry */
document.addEventListener('dragstart',e=>{const m=e.target.closest&&e.target.closest('[data-mp]');if(m){st.mpick=+m.dataset.mp;try{e.dataTransfer.setData('text/plain',m.dataset.mp)}catch(_){}}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-mslot]:not([disabled])'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-mslot]:not([disabled])');if(c&&st.mpick!=null){e.preventDefault();c.click()}});

</script></body></html>
